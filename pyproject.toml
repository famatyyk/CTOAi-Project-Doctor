[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-doctor"
version = "0.1.0"
description = "Safe, static health checks for Python and AI repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CTOAi Project Doctor" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
project-doctor = "project_doctor.cli:main"

[tool.setuptools]
packages = ["project_doctor"]

[tool.unittest]
start-directory = "tests"
